<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全景美股量化終端機 (SPY / NQ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        .glass-panel { background: rgba(22, 27, 34, 0.85); border: 1px solid #30363d; border-radius: 12px; backdrop-filter: blur(8px); }
        .badge-beat { background-color: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
        .badge-miss { background-color: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); }
        tr.clickable-row { cursor: pointer; transition: background-color 0.15s ease; }
        tr.clickable-row:hover { background-color: #161b22; }
        th { cursor: pointer; user-select: none; transition: color 0.2s; }
        th:hover { color: #58a6ff; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f17; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }
        .calc-input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 4px 8px; border-radius: 4px; width: 100%; font-family: monospace; }
        .calc-input:focus { outline: none; border-color: #58a6ff; }
        .calc-btn { background: #1f6feb; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 500; font-size: 0.875rem; width: 100%; transition: 0.2s; }
        .calc-btn:hover { background: #388bfd; }
        .filter-btn { padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; border: 1px solid #30363d; color: #787b86; transition: 0.2s; font-weight: 500; }
        .filter-btn:hover { color: #c9d1d9; border-color: #787b86; }
        .filter-btn.active { background: #58a6ff; color: #0b0f17; border-color: #58a6ff; font-weight: bold; }
        .fav-star { transition: transform 0.2s, color 0.2s; }
        .fav-star:hover { transform: scale(1.25); }
    </style>
</head>
<body class="p-4 md:p-6 gap-4">

    <!-- Header -->
    <header class="glass-panel p-4 md:p-5 flex justify-between items-center flex-shrink-0">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-white flex items-center gap-3">
                <i class="fas fa-chart-pie text-blue-500"></i> 美股全景量化數據終端
            </h1>
            <p class="text-xs md:text-sm text-gray-400 mt-1">即時基本面數據、P/E P/S P/B 估值模型與 SUE 盈餘動能試算</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-col xl:flex-row gap-6 flex-grow overflow-hidden">
        
        <!-- 左側主表區 (75%) -->
        <main class="xl:w-3/4 glass-panel flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                
                <!-- 搜尋與過濾頁籤 -->
                <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto items-start sm:items-center">
                    <div class="relative w-full sm:w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="搜尋代碼、公司名稱..." 
                            class="w-full pl-9 pr-4 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    
                    <!-- 分頁過濾按鈕 -->
                    <div class="flex gap-2 flex-wrap">
                        <button class="filter-btn active" id="btn-ALL" onclick="setMarketFilter('ALL')">全部股票</button>
                        <button class="filter-btn" id="btn-SP500" onclick="setMarketFilter('S&P 500')">S&P 500 (SPY)</button>
                        <button class="filter-btn" id="btn-NASDAQ" onclick="setMarketFilter('NASDAQ')">NASDAQ (NQ)</button>
                        <button class="filter-btn" id="btn-FAV" onclick="setMarketFilter('FAV')"><i class="fas fa-star text-yellow-500 mr-1"></i>我的最愛</button>
                    </div>
                </div>

                <div class="text-xs text-gray-400 hidden md:block">點擊 <i class="far fa-star"></i> 收藏 | 點擊股票查看估值與財報</div>
            </div>
            
            <div class="overflow-auto flex-grow relative">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="text-xs uppercase bg-gray-800 text-gray-400 sticky top-0 z-10 shadow-md">
                        <tr>
                            <th class="px-4 py-3.5 w-10 text-center"><i class="far fa-star"></i></th>
                            <th class="px-3 py-3.5" onclick="sortTable('ticker')">代碼 <i class="fas fa-sort ml-1"></i></th>
                            <th class="px-6 py-3.5" onclick="sortTable('name')">公司名稱 <i class="fas fa-sort ml-1"></i></th>
                            <th class="px-6 py-3.5 text-right" onclick="sortTable('price', true)">最新股價 <i class="fas fa-sort ml-1"></i></th>
                            <th class="px-6 py-3.5 text-right" onclick="sortTable('pe', true)">P/E (TTM) <i class="fas fa-sort ml-1"></i></th>
                            <th class="px-6 py-3.5 text-right" onclick="sortTable('profit', true)">淨利率 <i class="fas fa-sort ml-1"></i></th>
                            <th class="px-6 py-3.5 text-center" onclick="sortTable('surprise', true)">上季表現 <i class="fas fa-sort ml-1"></i></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-800">
                        <tr><td colspan="7" class="px-6 py-10 text-center text-gray-400">正在加載全市場數據...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>

        <!-- 右側經濟日曆 (25%) -->
        <aside class="xl:w-1/4 glass-panel flex flex-col overflow-hidden h-[450px] xl:h-auto">
            <div class="p-4 border-b border-gray-700">
                <h2 class="text-base font-semibold text-white"><i class="far fa-calendar-alt mr-2 text-blue-400"></i>美國宏觀經濟日曆</h2>
            </div>
            <div class="flex-grow p-1">
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                  <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
                  { "colorTheme": "dark", "isTransparent": true, "width": "100%", "height": "100%", "locale": "tw", "importanceFilter": "0,1", "countryFilter": "us" }
                  </script>
                </div>
            </div>
        </aside>

    </div>

    <!-- Modal 彈窗 (深度估值計算) -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="glass-panel bg-[#0d1117] border border-gray-700 w-full max-w-5xl my-8 rounded-xl relative flex flex-col shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white text-3xl font-bold p-1 leading-none z-10">&times;</button>
            
            <div class="p-6">
                <div class="flex items-center gap-4 border-b border-gray-700 pb-4 mb-6">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="modalTicker" class="text-3xl font-bold text-blue-400"></h2>
                            <span id="modalName" class="text-xl text-gray-200"></span>
                            <span id="modalSector" class="bg-gray-800 border border-gray-700 text-xs px-2.5 py-1 rounded text-gray-300"></span>
                        </div>
                        <p id="modalShortDesc" class="text-sm text-gray-400 mt-2"></p>
                    </div>
                </div>

                <!-- TTM 數據小卡 -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
                    <div class="bg-gray-800/50 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase">最新股價</div>
                        <div id="modalPrice" class="text-lg font-mono text-white mt-1"></div>
                    </div>
                    <div class="bg-gray-800/50 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase">P/E (TTM)</div>
                        <div id="modalPe" class="text-lg font-mono text-white mt-1"></div>
                    </div>
                    <div class="bg-gray-800/50 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase">P/S (市銷率)</div>
                        <div id="modalPs" class="text-lg font-mono text-white mt-1"></div>
                    </div>
                    <div class="bg-gray-800/50 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase">P/B (市淨率)</div>
                        <div id="modalPb" class="text-lg font-mono text-white mt-1"></div>
                    </div>
                    <div class="bg-gray-800/50 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-500 uppercase">EV/EBITDA</div>
                        <div id="modalEv" class="text-lg font-mono text-white mt-1"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- 左欄 -->
                    <div class="flex flex-col gap-6">
                        <div class="bg-gray-800/30 p-4 rounded-lg border border-gray-700/60">
                            <h3 class="text-sm font-bold text-gray-400 uppercase mb-2"><i class="fas fa-building mr-2"></i>業務介紹</h3>
                            <div class="max-h-40 overflow-y-auto pr-2 text-xs text-gray-300 leading-relaxed" id="modalStory"></div>
                        </div>
                        
                        <div>
                            <h3 class="text-sm font-bold text-gray-400 uppercase mb-2"><i class="fas fa-history mr-2"></i>歷史財報紀錄</h3>
                            <div class="overflow-x-auto rounded border border-gray-700 max-h-48 overflow-y-auto">
                                <table class="w-full text-left text-xs">
                                    <thead class="bg-gray-800 text-gray-400 sticky top-0">
                                        <tr>
                                            <th class="px-3 py-2">季度</th>
                                            <th class="px-3 py-2 text-right">預期 EPS</th>
                                            <th class="px-3 py-2 text-right">實際 EPS</th>
                                            <th class="px-3 py-2 text-right">Surprise</th>
                                            <th class="px-3 py-2 text-center">狀態</th>
                                        </tr>
                                    </thead>
                                    <tbody id="modalHistoryTable" class="divide-y divide-gray-800 bg-gray-900/60 font-mono"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- 右欄：估值模型 -->
                    <div class="flex flex-col gap-4">
                        <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                            <h3 class="text-blue-400 font-bold mb-3 flex items-center text-sm"><i class="fas fa-calculator mr-2"></i>價值估值分析 (合理價試算)</h3>
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <div><label class="text-xs text-gray-500">預估未來 EPS</label><input type="number" id="calcEps" class="calc-input" step="0.01"></div>
                                <div><label class="text-xs text-gray-500">合理 P/E</label><input type="number" id="calcPe" class="calc-input" value="15"></div>
                            </div>
                            <button onclick="calcValuation()" class="calc-btn mb-2">計算合理股價與安全邊際</button>
                            <div id="valResult" class="text-xs p-3 bg-gray-800 rounded border border-gray-700 hidden"></div>
                        </div>

                        <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                            <h3 class="text-purple-400 font-bold mb-3 flex items-center text-sm"><i class="fas fa-rocket mr-2"></i>PEAD 盈餘動能模型 (SUE)</h3>
                            <div class="grid grid-cols-3 gap-3 mb-3">
                                <div><label class="text-xs text-gray-500">預期 EPS</label><input type="number" id="peadEst" class="calc-input" step="0.01"></div>
                                <div><label class="text-xs text-gray-500">實際 EPS</label><input type="number" id="peadAct" class="calc-input" step="0.01"></div>
                                <div><label class="text-xs text-gray-500">標準差</label><input type="number" id="peadStd" class="calc-input" value="0.1" step="0.01"></div>
                            </div>
                            <button onclick="calcPead()" class="calc-btn bg-purple-600 hover:bg-purple-500 mb-2">計算 SUE 爆發分數</button>
                            <div id="peadResult" class="text-xs p-3 bg-gray-800 rounded border border-gray-700 hidden"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stocksData = [];
        let currentModalPrice = 0;
        let currentMarketFilter = 'ALL';
        let favoriteStocks = JSON.parse(localStorage.getItem('favStocks')) || [];

        fetch('sp500_data.json')
            .then(response => response.json())
            .then(data => {
                stocksData = data;
                filterTable();
            })
            .catch(error => {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-red-400">數據更新中，請稍後刷頁...</td></tr>';
            });

        let currentSortColumn = '';
        let isAscending = true;

        function toggleFavorite(event, ticker) {
            event.stopPropagation();
            if(favoriteStocks.includes(ticker)) favoriteStocks = favoriteStocks.filter(t => t !== ticker);
            else favoriteStocks.push(ticker);
            localStorage.setItem('favStocks', JSON.stringify(favoriteStocks));
            filterTable();
        }

        function setMarketFilter(market) {
            currentMarketFilter = market;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            let btnId = 'btn-' + (market === 'S&P 500' ? 'SP500' : (market === 'NASDAQ' ? 'NASDAQ' : market));
            document.getElementById(btnId).classList.add('active');
            filterTable();
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = stocksData.filter(stock => 
                stock.ticker.toLowerCase().includes(query) ||
                stock.name.toLowerCase().includes(query)
            );

            if (currentMarketFilter === 'FAV') {
                filtered = filtered.filter(stock => favoriteStocks.includes(stock.ticker));
            } else if (currentMarketFilter === 'S&P 500') {
                filtered = filtered.filter(stock => stock.marketIndex === 'S&P 500' || stock.marketIndex === 'BOTH');
            } else if (currentMarketFilter === 'NASDAQ') {
                filtered = filtered.filter(stock => stock.marketIndex === 'NASDAQ' || stock.marketIndex === 'BOTH');
            }

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">找不到符合條件的標的</td></tr>';
                return;
            }

            data.forEach(item => {
                let statusBadge = '';
                if (item.surprise > 0) statusBadge = `<span class="badge-beat text-xs font-semibold px-2 py-0.5 rounded"><i class="fas fa-arrow-up mr-1"></i>Beat (+${item.surprise}%)</span>`;
                else if (item.surprise < 0) statusBadge = `<span class="badge-miss text-xs font-semibold px-2 py-0.5 rounded"><i class="fas fa-arrow-down mr-1"></i>Miss (${item.surprise}%)</span>`;
                else statusBadge = `<span class="text-gray-500">-</span>`;

                const isFav = favoriteStocks.includes(item.ticker);
                const starClass = isFav ? 'fas fa-star text-yellow-500' : 'far fa-star text-gray-600';

                // 指數標籤
                let indexTag = '';
                if(item.marketIndex === 'NASDAQ') indexTag = `<span class="text-[10px] bg-purple-900/40 text-purple-400 border border-purple-800/60 px-1.5 py-0.5 rounded ml-2">NQ</span>`;
                else if(item.marketIndex === 'S&P 500') indexTag = `<span class="text-[10px] bg-blue-900/40 text-blue-400 border border-blue-800/60 px-1.5 py-0.5 rounded ml-2">SPY</span>`;
                else if(item.marketIndex === 'BOTH') indexTag = `<span class="text-[10px] bg-green-900/40 text-green-400 border border-green-800/60 px-1.5 py-0.5 rounded ml-2">SPY+NQ</span>`;

                const tr = document.createElement('tr');
                tr.className = 'clickable-row border-b border-gray-800/60';
                tr.onclick = () => openModal(item);

                tr.innerHTML = `
                    <td class="px-4 py-3.5 text-center">
                        <i class="${starClass} fav-star text-base cursor-pointer" onclick="toggleFavorite(event, '${item.ticker}')"></i>
                    </td>
                    <td class="px-3 py-3.5 font-bold text-blue-400 font-mono">${item.ticker}</td>
                    <td class="px-6 py-3.5 font-medium text-gray-200">
                        ${item.name} ${indexTag}
                    </td>
                    <td class="px-6 py-3.5 text-right text-white font-mono font-bold">$${item.price.toFixed(2)}</td>
                    <td class="px-6 py-3.5 text-right text-gray-300 font-mono">${item.pe || 'N/A'}</td>
                    <td class="px-6 py-3.5 text-right text-green-400 font-mono">${item.profit.toFixed(1)}%</td>
                    <td class="px-6 py-3.5 text-center">${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortTable(column, isNumeric = false) {
            if (currentSortColumn === column) isAscending = !isAscending;
            else { currentSortColumn = column; isAscending = true; }
            stocksData.sort((a, b) => {
                let valA = a[column], valB = b[column];
                if (isNumeric) return isAscending ? valA - valB : valB - valA;
                else return isAscending ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
            });
            filterTable();
        }

        function openModal(stock) {
            document.getElementById('modalTicker').innerText = stock.ticker;
            document.getElementById('modalName').innerText = stock.name;
            document.getElementById('modalSector').innerText = stock.sector;
            document.getElementById('modalShortDesc').innerText = stock.shortDesc;
            document.getElementById('modalStory').innerText = stock.story;
            
            document.getElementById('modalPrice').innerText = '$' + stock.price.toFixed(2);
            document.getElementById('modalPe').innerText = stock.pe || 'N/A';
            document.getElementById('modalPs').innerText = stock.ps || 'N/A';
            document.getElementById('modalPb').innerText = stock.pb || 'N/A';
            document.getElementById('modalEv').innerText = stock.evEbitda || 'N/A';

            currentModalPrice = stock.price;
            document.getElementById('calcEps').value = stock.actEps || '';
            document.getElementById('calcPe').value = stock.pe > 0 ? Math.min(stock.pe, 25) : 15;
            document.getElementById('valResult').classList.add('hidden');

            document.getElementById('peadEst').value = stock.estEps || '';
            document.getElementById('peadAct').value = stock.actEps || '';
            document.getElementById('peadResult').classList.add('hidden');

            const histBody = document.getElementById('modalHistoryTable');
            histBody.innerHTML = '';
            if(stock.history && stock.history.length > 0) {
                stock.history.forEach(h => {
                    let isBeat = h.surprise > 0;
                    let colorClass = isBeat ? 'text-green-400' : 'text-red-400';
                    histBody.innerHTML += `
                        <tr class="hover:bg-gray-800/40">
                            <td class="px-3 py-2 text-gray-300">${h.quarter}</td>
                            <td class="px-3 py-2 text-right text-gray-500">$${h.est}</td>
                            <td class="px-3 py-2 text-right text-white font-bold">$${h.act}</td>
                            <td class="px-3 py-2 text-right ${colorClass}">${h.surprise > 0 ? '+':''}${h.surprise}%</td>
                            <td class="px-3 py-2 text-center text-xs ${colorClass}">${h.status}</td>
                        </tr>
                    `;
                });
            } else {
                histBody.innerHTML = '<tr><td colspan="5" class="px-3 py-4 text-center text-gray-500">無歷史數據</td></tr>';
            }

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        function calcValuation() {
            const eps = parseFloat(document.getElementById('calcEps').value);
            const pe = parseFloat(document.getElementById('calcPe').value);
            const resBox = document.getElementById('valResult');
            if(!eps || !pe) return;
            const fairValue = eps * pe;
            const margin = ((fairValue - currentModalPrice) / fairValue * 100).toFixed(1);
            let diag = margin > 0 ? `<span class="text-green-400">目前折價 ${margin}% (具備安全邊際)</span>` : `<span class="text-red-400">目前溢價 ${Math.abs(margin)}% (估值偏高)</span>`;
            resBox.innerHTML = `合理股價：<span class="text-sm font-bold text-white">$${fairValue.toFixed(2)}</span><br>${diag}`;
            resBox.classList.remove('hidden');
        }

        function calcPead() {
            const est = parseFloat(document.getElementById('peadEst').value);
            const act = parseFloat(document.getElementById('peadAct').value);
            const std = parseFloat(document.getElementById('peadStd').value);
            const resBox = document.getElementById('peadResult');
            if(isNaN(est) || isNaN(act) || !std) return;
            const sue = ((act - est) / std).toFixed(2);
            let diag = sue > 2 ? "🔥 極度強烈驚喜！" : sue > 0.5 ? "📈 溫和驚喜，具備動能。" : sue > -0.5 ? "平淡，股價可能盤整。" : "⚠️ 負向驚喜。";
            resBox.innerHTML = `SUE 分數：<span class="text-sm font-bold text-white">${sue}</span><br><span class="text-gray-300">${diag}</span>`;
            resBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
